###############################################################################
# Hardware rendering for the Lab 0 container, on Linux.
#
# lab.sh adds this file automatically when it finds /dev/dri, and adds the
# nvidia stanza below only when the NVIDIA container toolkit is actually
# installed. It is kept out of docker-compose.yml because compose fails hard on
# a `devices:` entry whose node does not exist, and a headless machine has no
# /dev/dri at all - there, the base file alone still works over VNC.
#
# Without this, Gazebo falls back to Mesa's software rasteriser: correct, but
# slow enough to make Test 7 unpleasant.
###############################################################################
services:
  lab:
    devices:
      # Direct Rendering Infrastructure: the kernel side of your GPU. Enough on
      # its own for Intel and AMD.
      - /dev/dri:/dev/dri
    environment:
      # NVIDIA cards need the driver libraries injected by the container
      # toolkit, and "graphics" (not just "compute") for GL to work at all -
      # the default capability set is compute+utility, which renders nothing.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
