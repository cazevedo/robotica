###############################################################################
# NVIDIA GPU reservation, layered on top of docker-compose.gpu.yml.
#
# Separate again because this stanza needs the NVIDIA container toolkit on the
# host; without it compose refuses to start with "could not select device
# driver nvidia". lab.sh checks for the toolkit before adding this file, so an
# AMD or Intel machine simply never sees it and renders through /dev/dri alone.
#
# Host prerequisite (needs sudo, so it is not scripted):
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
###############################################################################
services:
  lab:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
